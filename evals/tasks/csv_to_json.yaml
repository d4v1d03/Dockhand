name: csv_to_json
kind: empty
prompt: |
  Write csv2json.py: a CLI that takes a CSV file path as its only argument and prints
  a JSON array of objects to stdout (first row = keys, all values as strings).
  An empty CSV file must print []. Add a couple of pytest tests and make them pass.
hidden:
  tests/test_hidden_csv2json.py: |
    import json, subprocess, sys

    def run(tmp_path, text):
        p = tmp_path / "in.csv"; p.write_text(text)
        r = subprocess.run([sys.executable, "csv2json.py", str(p)], capture_output=True, text=True, cwd="/workspace")
        assert r.returncode == 0, r.stderr
        return json.loads(r.stdout)

    def test_rows(tmp_path):
        assert run(tmp_path, "a,b\n1,2\n3,4\n") == [{"a": "1", "b": "2"}, {"a": "3", "b": "4"}]

    def test_empty(tmp_path):
        assert run(tmp_path, "") == []

    def test_quoted_comma(tmp_path):
        assert run(tmp_path, 'name,city\n"Doe, J",Paris\n') == [{"name": "Doe, J", "city": "Paris"}]
check: python3 -m pytest -q tests/test_hidden_csv2json.py
