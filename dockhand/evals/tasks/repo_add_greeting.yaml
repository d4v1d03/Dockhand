name: repo_add_greeting
kind: repo
repo_url: https://github.com/octocat/Hello-World
prompt: |
  This repo only has a README. Add greet.py with a function greet(name: str) -> str that
  returns "Hello, <name>!" and, when run as a script with a name argument, prints it.
  Add a pytest test and make it pass.
hidden:
  tests/test_hidden_greet.py: |
    import sys, subprocess; sys.path.insert(0, "/workspace")
    from greet import greet

    def test_greet():
        assert greet("World") == "Hello, World!"

    def test_cli():
        r = subprocess.run([sys.executable, "/workspace/greet.py", "Ada"], capture_output=True, text=True)
        assert r.stdout.strip() == "Hello, Ada!"
check: python3 -m pytest -q tests/test_hidden_greet.py
