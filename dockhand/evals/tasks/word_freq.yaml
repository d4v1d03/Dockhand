name: word_freq
kind: empty
prompt: |
  Create wordfreq.py exposing a function top_words(text: str, n: int) -> list[tuple[str, int]]
  that returns the n most common words (case-insensitive, punctuation stripped) with their
  counts, most frequent first; ties broken alphabetically. Add pytest tests and make them pass.
hidden:
  tests/test_hidden_wordfreq.py: |
    import sys; sys.path.insert(0, "/workspace")
    from wordfreq import top_words

    def test_basic():
        assert top_words("the cat and the hat and the bat", 2) == [("the", 3), ("and", 2)]

    def test_case_and_punct():
        assert top_words("Hello, hello! HELLO world.", 1) == [("hello", 3)]

    def test_tie_alphabetical():
        assert top_words("b a c", 3) == [("a", 1), ("b", 1), ("c", 1)]

    def test_n_larger_than_vocab():
        assert top_words("x", 5) == [("x", 1)]
check: python3 -m pytest -q tests/test_hidden_wordfreq.py
