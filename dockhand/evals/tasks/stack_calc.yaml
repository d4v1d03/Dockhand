name: stack_calc
kind: empty
prompt: |
  Implement rpn.py with a function evaluate(expr: str) -> float that evaluates a
  Reverse Polish Notation expression with + - * / and integer/decimal operands, e.g.
  evaluate("3 4 + 2 *") == 14. Division by zero must raise ZeroDivisionError; a malformed
  expression must raise ValueError. Add pytest tests and make them pass.
hidden:
  tests/test_hidden_rpn.py: |
    import sys; sys.path.insert(0, "/workspace")
    import pytest
    from rpn import evaluate

    def test_examples():
        assert evaluate("3 4 + 2 *") == 14
        assert evaluate("5 1 2 + 4 * + 3 -") == 14
        assert evaluate("2.5 2 *") == 5.0

    def test_div_zero():
        with pytest.raises(ZeroDivisionError):
            evaluate("1 0 /")

    def test_malformed():
        with pytest.raises(ValueError):
            evaluate("1 +")
        with pytest.raises(ValueError):
            evaluate("1 2")
check: python3 -m pytest -q tests/test_hidden_rpn.py
