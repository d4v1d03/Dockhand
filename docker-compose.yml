# docker compose up            -> http://localhost:8088 (TRAEFIK_PORT to change)
# docker compose up -d redis   -> broker only, for local development

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: sqlite:////app/data/dockhand.db
  volumes:
    - app-data:/app/data
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "${TRAEFIK_PORT:-8088}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    <<: *app
    # no host port: traefik fronts it so `--scale web=N` just works
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=8000
      - traefik.http.services.web.loadbalancer.healthcheck.path=/health
      - traefik.http.services.web.loadbalancer.healthcheck.interval=10s

  worker:
    <<: *app
    command: ["celery", "-A", "dockhand.worker", "worker", "-l", "info", "--concurrency=2"]
    volumes:
      - app-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redis-data:
  app-data:
